<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View and download Ahaan Wanvari's resume — Security Engineer & Developer." />
  <title>Resume — Ahaan Wanvari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg: #06060f; --text: #f8f8ff; --secondary: #a5a5c0; --border: rgba(255, 255, 255, 0.1); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at top right, rgba(139, 92, 246, 0.2), transparent 55%), radial-gradient(ellipse at bottom left, rgba(99, 102, 241, 0.15), transparent 55%); }
    a { color: var(--text); }
    a:focus-visible { outline: 2px solid #22d3ee; outline-offset: 5px; }
    .navbar { position: relative; width: fit-content; max-width: calc(100% - 1rem); margin: 1rem auto 0; padding: 0.6rem 1.75rem; background: rgba(6, 6, 15, 0.4); border: 1px solid var(--border); border-radius: 100px; backdrop-filter: blur(30px); }
    .navbar-content { display: flex; align-items: center; justify-content: center; gap: 2rem; }
    .logo { font-size: 1.1rem; font-weight: 800; text-decoration: none; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { color: var(--secondary); font-size: 0.8rem; font-weight: 600; text-decoration: none; }
    .nav-links a:hover, .nav-links a[aria-current] { color: var(--text); }
    main { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem 4rem; }
    .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; letter-spacing: -1px; }
    .subtitle { color: var(--secondary); font-size: 0.92rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .btn { display: inline-block; padding: 0.75rem 1.25rem; border: 1px solid var(--border); border-radius: 14px; background: rgba(255, 255, 255, 0.06); font-size: 0.82rem; font-weight: 700; text-decoration: none; }
    .btn:hover { background: rgba(255, 255, 255, 0.12); }
    .btn-primary { background: #8b5cf6; border-color: #8b5cf6; }
    .btn-primary:hover { background: #7c3aed; }
    .viewer { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, 0.04); box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3); }
    object { display: block; width: 100%; height: 80vh; min-height: 500px; }
    .fallback { padding: 2rem; color: var(--secondary); }
    .viewer-help { color: var(--secondary); font-size: 0.8rem; margin-top: 1rem; }
    footer { border-top: 1px solid var(--border); padding: 2rem; text-align: center; color: var(--secondary); font-size: 0.78rem; }
    footer a { text-decoration: none; }
    @media (max-width: 600px) {
      .navbar { border-radius: 16px; padding: 0.6rem 1rem; }
      .navbar-content { flex-wrap: wrap; gap: 0.4rem 1rem; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 0.4rem 0.75rem; }
      .nav-links a { font-size: 0.72rem; }
      main { padding: 2rem 1rem 3rem; }
      object { height: 70vh; min-height: 400px; }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">

        <li><a href="/resume.html" aria-current="page">Resume</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main>
    <header class="page-header">
      <div>
        <h1>Resume</h1>
        <p class="subtitle">Ahaan Wanvari &middot; Security Engineer &amp; Developer</p>
      </div>
      <div class="actions">
        <a class="btn" href="/assets/resume.pdf" target="_blank" rel="noopener">Open PDF <span aria-hidden="true">↗</span><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"> (new tab)</span></a>
        <a class="btn btn-primary" href="/assets/resume.pdf" download="Ahaan-Wanvari-Resume.pdf">Download PDF</a>
      </div>
    </header>
    <div class="viewer">
      <object data="/assets/resume.pdf" type="application/pdf" aria-label="Ahaan Wanvari's resume">
        <p class="fallback">Your browser cannot display this PDF inline. <a href="/assets/resume.pdf">Open the resume PDF</a> to read it.</p>
      </object>
    </div>
    <p class="viewer-help">Having trouble viewing the resume? <a href="/assets/resume.pdf">Open the PDF directly</a> or use the download button above.</p>
  </main>
  <footer><p>&copy; 2026 Ahaan Wanvari &middot; <a href="/">Back to Portfolio</a></p></footer>
</body>
</html>
